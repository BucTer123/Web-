<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>MOGGOZIN.COM</title>
	<style>
.catalogs-wrapper {
	width: 100%;
	max-width: 750px;
	padding: 30px;
	display: flex;
	flex-direction: column;
	gap: 18px;
}

.catalogs-wrapper > div:not(.searcher-wrapper) {
	position: relative;
	min-height: 95px;
	display: flex;
	justify-content: center;
	align-items: center;

	background: linear-gradient(
    	135deg,
    	rgba(79, 70, 229, 0.3),
    	rgba(8, 145, 178, 0.2)
	);

	border: 1px solid rgba(129, 140, 248, 0.25);
	border-radius: 18px;

	cursor: pointer;
	transition: 0.3s ease;
}

.catalogs-wrapper > div:not(.searcher-wrapper) button {
	position: absolute;
	inset: 0;

	width: 100%;
	height: 100%;

	opacity: 0;
	cursor: pointer;
	z-index: 1;
}

.catalogs-wrapper > div:not(.searcher-wrapper) span {
	position: relative;
	z-index: 2;

	color: #e0e7ff;
	font-size: 16px;
	font-weight: 600;
	letter-spacing: 0.5px;

	pointer-events: none;
}

.catalogs-wrapper > div:not(.searcher-wrapper):hover {
	transform: translateY(-5px);

	border-color: rgba(167, 139, 250, 0.7);

	box-shadow:
    	0 12px 30px rgba(0, 0, 0, 0.3),
    	0 0 25px rgba(99, 102, 241, 0.2);
}

.catalogs-wrapper > div:not(.searcher-wrapper):active {
	transform: scale(0.98);
}

.searcher-wrapper {
	display: flex;
	align-items: stretch;
	gap: 15px;

	padding: 20px;

	background: rgba(15, 23, 42, 0.65);

	border: 1px solid rgba(129, 140, 248, 0.2);
	border-radius: 20px;
}

.searcher-wrapper .input-wrapper {
	flex: 1;
	min-width: 0;

	display: flex;
	flex-direction: column-reverse;
	gap: 10px;
}

.searcher-wrapper .button-wrapper {
	width: 115px;

	display: flex;
	flex-direction: column-reverse;
	gap: 10px;
}

.searcher-wrapper span {
	font-size: 13px;
	font-weight: 600;
	letter-spacing: 0.6px;
	color: #c4b5fd;
}

#inp {
	width: 100%;
	height: 48px;
	padding: 0 15px;

	color: white;
	font-size: 15px;
	font-family: inherit;

	background: linear-gradient(
    	120deg,
    	rgba(30, 27, 75, 0.8),
    	rgba(15, 23, 42, 0.95)
	);

	border: 1px solid #37376b;
	border-radius: 12px;
	outline: none;

	transition: 0.3s ease;
}

#inp:focus {
border-color: #a78bfa;

box-shadow:
    0 0 0 3px rgba(167, 139, 250, 0.15),
    0 0 20px rgba(139, 92, 246, 0.15);

}

#btn {
width: 100%;
height: 48px;

background: linear-gradient(
    110deg,
    #7c3aed,
    #6366f1,
    #06b6d4
);

background-size: 200% 200%;

border: none;
border-radius: 12px;
cursor: pointer;

box-shadow: 0 5px 20px rgba(124, 58, 237, 0.3);

transition: 0.3s ease;

}

#btn:hover {
background-position: 100% 50%;
transform: translateY(-3px);

box-shadow: 0 10px 30px rgba(124, 58, 237, 0.4);

}

#btn:active {
	transform: scale(0.97);
}
	</style>
</head>
<body>
	<div class="catalogs-wrapper">
		<div class="catalog-electronics-wrapper">
			<button id="electronics" type=button></button>
			<span for="electronics">Electronics</span>
		</div>
		<div class="catalog-food_and_drink-wrapper">
			<button id="food_and_drink" type=button></button>
			<span for="food_and_drink">For 0 Zloty</span>
		</div>
		<div class="catalog-apartments-wrapper">
			<button id="apartments" type=button></button>
			<span for="apartments">Apartments</span>
		</div>
		<div class="catalog-automotive-wrapper">
			<button id="automotive" type=button></button>
			<span for="automotive">Automotive</span>
		</div>
		<div class="searcher-wrapper">
			<div class="input-wrapper">
				<input id="inp" type=text />
				<span for="inp">Search</span>
			</div>
			<div class="button-wrapper">
				<button id="btn" type=button></button>
				<span for="btn">Submit</span>
			</div>
		</div>
	</div>
</body>
<script>
	const electronics = document.getElementById("electronics");
	const foodanddrink = document.getElementById("food_and_drink");
	const apartments = document.getElementById("apartments");
	const automotive = document.getElementById("automotive");
	const inp = document.getElementById("inp");
	const btn = document.getElementById("btn");

	electronics.addEventListener("click", function() {
		window.location.href = "electronic.html";
	});
	foodanddrink.addEventListener("click", function() {
		window.location.href = "for0.html";
	});
	apartments.addEventListener("click", function() {
		window.location.href = "apart.html";
	});
	automotive.addEventListener("click", function() {
		window.location.href = "auto.html";
	});
	btn.addEventListener("click", function() {
		const txt = inp.value.trim().toLowerCase();
		
		if (txt === "electronics") {
			window.location.href = "electronic.html";
		} 
		else if (txt === "for0") {
			window.location.href = "for0.html";
		}
		else if (txt === "apartments") {
			window.location.href = "apart.html";
		}
		else if (txt === "automotive") {
			window.location.href = "auto.html";
		}
	});
</script>
</html>
