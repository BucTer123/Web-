<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" >
	<title>MAINSITE!</title>
	<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Segoe UI", sans-serif;

    background: linear-gradient(
        135deg,
        #0f0c29,
        #302b63,
        #24243e
    );

    color: white;
}

.main-wrapper {
    display: flex;
    flex-direction: column;
    gap: 35px;
    padding: 40px;
    width: 350px;

    background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.10),
        rgba(255, 255, 255, 0.02)
    );

    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;

    backdrop-filter: blur(20px);

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(139, 92, 246, 0.15);
}

.username-wrapper {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.username-wrapper span,
.button-wrapper span {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #c4b5fd;
}

#login {
    width: 100%;
    padding: 14px 16px;

    color: white;
    font-size: 15px;

    background: linear-gradient(
        135deg,
        rgba(17, 24, 39, 0.9),
        rgba(49, 46, 129, 0.4)
    );

    border: 1px solid #494078;
    border-radius: 12px;
    outline: none;

    transition: 0.3s ease;
}

#login:focus {
    border-color: #a78bfa;

    box-shadow:
        0 0 0 3px rgba(167, 139, 250, 0.15),
        0 0 25px rgba(139, 92, 246, 0.2);
}

.button-wrapper {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

#btn {
    width: 100%;
    height: 48px;

    background: linear-gradient(
        120deg,
        #7c3aed,
        #6366f1,
        #06b6d4
    );

    background-size: 200% 200%;

    border: none;
    border-radius: 12px;
    cursor: pointer;

    box-shadow:
        0 5px 20px rgba(124, 58, 237, 0.3);

    transition:
        background-position 0.4s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

#btn:hover {
    background-position: 100% 50%;
    transform: translateY(-3px);

    box-shadow:
        0 10px 30px rgba(124, 58, 237, 0.45),
        0 0 25px rgba(6, 182, 212, 0.2);
}
#btn:active {
    transform: scale(0.97);
}

@media (max-width: 400px) {
    .main-wrapper {
        width: calc(100% - 32px);
        padding: 28px;
    }
}
	</style>
</head>
<body>
	<div class="main-wrapper">
		<div class="username-wrapper">
			<input id="login" type=text />
			<span for="login">Username :</span>
		</div>
		<div class="button-wrapper">
			<button id="btn" type=button></button>
			<span for="btn">Button</span>
		</div>
	</div>
</body>
<script>
	const inp = document.getElementById("login");
	const btn = document.getElementById("btn");
	const txt = inp.value;

	function check() {
		if (txt) {
			window.location.href = "main.html";
		} else {
			window.alert("ERROR!: Write username!");
		}
	}

	btn.addEventListener("click", function() {
		check();
	});

	document.getElementById("keydown", function(event) {
		if (event.type === "enter") {
			check();
		}
		else if (event.type === "e") {
			check();
		}
	});

</script>
</html>
